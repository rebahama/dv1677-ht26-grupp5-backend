name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bygg Docker-image
        run: docker build -t grupp5-backend .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm test -- --run

  #
  # Lägg även till `needs: test` i deploy.yml så att deploy
  # bara sker om testerna går igenom.

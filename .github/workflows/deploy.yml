name: Deploy
on:
  push:
    branches: [main, dev]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Run tests
        run: npm test -- --run
        env:
          NODE_ENV: test
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Logga in på ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bygg och pusha image till ghcr.io
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ghcr.io/rebahama/dv1677-ht26-grupp5-backend:latest

      - name: Kopiera docker-compose.yml till VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.yml
          target: ~/dv1677-ht26-grupp5-backend/

      - name: Deploya till VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/dv1677-ht26-grupp5-backend
            echo "MONGODB_URI=${{ secrets.MONGODB_URI }}" > .env
            echo "PORT=3000" >> .env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            chmod 600 .env
            docker compose pull
            docker compose up -d

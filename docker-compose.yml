services:
  app:
    image: ghcr.io/rebahama/dv1677-ht26-grupp5-backend:latest
    container_name: grupp5-backend
    ports:
      - "3000:3000"
    environment:
      # MONGODB_URI sätts via .env-fil på VPS (injiceras av deploy.yml från GitHub Secret)
      # Fallback: mongodb://mongodb:27017 (Docker-container, används om secret saknas)
      - PORT=${PORT:-3000}
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017}
      - DATABASE_NAME=proxmox_booking
      - JWT_SECRET=${JWT_SECRET}
      - BROKER_API_URL=${BROKER_API_URL}
      - BROKER_GROUP_TOKEN=${BROKER_GROUP_TOKEN}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
    depends_on:
      - mongodb
    restart: always

  mongodb:
    image: mongo:latest
    container_name: mongodb
    volumes:
      - mongodb_data:/data/db
    restart: always

volumes:
  mongodb_data:
